<!DOCTYPE html>
<html>
  <head>
    <title>ABB AR Reel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>

    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.9);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      #fullscreenVideo {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        display: none;
        z-index: 9998;
        background: black;
      }
    </style>
  </head>

  <body>

    <!-- OVERLAY -->
    <div id="overlay">
      <p>🎧 Toca para iniciar</p>
      <button id="startBtn">Iniciar</button>
    </div>

    <!-- VIDEO FULLSCREEN -->
    <video
      id="video"
      src="ABB VIDEO EDITADO.mp4"
      playsinline
      webkit-playsinline
      preload="auto"
      loop>
    </video>

    <!-- AR -->
    <a-scene embedded arjs vr-mode-ui="enabled: false">
      <a-marker type="pattern" url="marker2.patt" id="marker"></a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('video');
      const marker = document.getElementById('marker');
      const overlay = document.getElementById('overlay');
      const btn = document.getElementById('startBtn');

      let ready = false;

      // Config móvil
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');

      // 🔥 PASO CLAVE: desbloquear video
      btn.addEventListener('click', async () => {
        try {
          video.muted = true;
          await video.play();   // desbloquea autoplay
          video.pause();
          video.currentTime = 0;
          video.muted = false;

          overlay.style.display = 'none';
          ready = true;

          console.log('✅ Video desbloqueado');
        } catch (e) {
          alert('Error: ' + e);
        }
      });

      // Detecta marcador
      marker.addEventListener('markerFound', async () => {
        if (!ready) return;

        try {
          video.style.display = 'block';
          await video.play();
          console.log('🎬 FULLSCREEN ON');
        } catch (e) {
          console.warn(e);
        }
      });

      // Pierde marcador
      marker.addEventListener('markerLost', () => {
        video.pause();
        video.style.display = 'none';
        console.log('⛔ FULLSCREEN OFF');
      });
    </script>

  </body>
</html>
