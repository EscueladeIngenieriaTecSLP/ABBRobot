<!DOCTYPE html>
<html>
  <head>
    <title>ABB AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <!-- Librerías -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>

    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        font-family: system-ui, sans-serif;
      }

      /* Overlay inicio */
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      #overlay button {
        background-color: #ff3333;
        color: white;
        border: none;
        padding: 12px 20px;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
      }

      #overlay button:hover {
        background-color: #ff5555;
      }
    </style>
  </head>

  <body>

    <!-- Overlay -->
    <div id="overlay">
      <p>🎧 Toca para iniciar el video con sonido</p>
      <button id="startBtn">Reproducir</button>
    </div>

    <!-- Escena AR -->
    <a-scene embedded arjs vr-mode-ui="enabled: false">
      
      <a-assets>
        <video
          id="abbVideo"
          src="ABB VIDEO EDITADO.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          loop>
        </video>
      </a-assets>

      <!-- MARKER 2 -->
      <a-marker type="pattern" url="marker2.patt" id="marker">

        <!-- 🔥 VIDEO CORREGIDO (SIN ZOOM RARO) -->
        <a-video
          src="#abbVideo"
          width="2"
          height="1.125"
          position="0 0 0"
          rotation="-90 0 0"
          material="shader: flat; side: double;">
        </a-video>

        <a-text
          value="ABB | Video demo"
          position="0 1.2 0"
          rotation="-90 0 0"
          scale="0.4 0.4 0.4"
          color="red">
        </a-text>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('abbVideo');
      const marker = document.getElementById('marker');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');

      // Config móvil
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');

      // Botón inicio (audio)
      startBtn.addEventListener('click', async () => {
        try {
          await video.play();
          overlay.style.display = 'none';
        } catch (err) {
          alert('Error al reproducir: ' + err.message);
        }
      });

      // Detecta marcador
      marker.addEventListener('markerFound', () => {
        if (overlay.style.display === 'none') {
          if (video.paused) {
            video.play().catch(err => console.warn(err));
          }
        }
      });

      // Pierde marcador
      marker.addEventListener('markerLost', () => {
        if (!video.paused) video.pause();
      });
    </script>

  </body>
</html>
