<!DOCTYPE html>
<html>
  <head>
    <title>ABB AR Reel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <!-- Librerías -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>

    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
      }

      /* Overlay inicio */
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.9);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: system-ui;
      }

      #overlay button {
        padding: 12px 20px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        background: #ff3333;
        color: white;
      }

      /* VIDEO FULLSCREEN (SIN ZOOM) */
      #video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: contain; /* 🔥 evita zoom */
        background: black;
        display: none;
        z-index: 9998;
      }
    </style>
  </head>

  <body>

    <!-- OVERLAY -->
    <div id="overlay">
      <p>🎧 Toca para iniciar</p>
      <button id="startBtn">Iniciar</button>
    </div>

    <!-- VIDEO -->
    <video
      id="video"
      src="abb-video-editado.mp4"
      playsinline
      webkit-playsinline
      preload="auto"
      loop>
    </video>

    <!-- AR -->
    <a-scene embedded arjs vr-mode-ui="enabled: false">
      <a-marker type="pattern" url="marker2.patt" id="marker"></a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('video');
      const marker = document.getElementById('marker');
      const overlay = document.getElementById('overlay');
      const btn = document.getElementById('startBtn');

      let ready = false;

      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');

      // 🔥 Desbloquear audio/video en móvil
      btn.addEventListener('click', async () => {
        try {
          video.muted = true;
          await video.play();
          video.pause();
          video.currentTime = 0;
          video.muted = false;

          overlay.style.display = 'none';
          ready = true;

          console.log('✅ Listo');
        } catch (e) {
          alert('Error: ' + e);
        }
      });

      // Mostrar video al detectar marcador
      marker.addEventListener('markerFound', async () => {
        if (!ready) return;

        try {
          video.style.display = 'block';
          await video.play();
        } catch (e) {
          console.warn(e);
        }
      });

      // Ocultar video al perder marcador
      marker.addEventListener('markerLost', () => {
        video.pause();
        video.style.display = 'none';
      });
    </script>

  </body>
</html>
